stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE_NAME: technologieswithak2/max-live-spring-gateway:v1
  # REMOTE_HOST: 44.209.31.1
  # REMOTE_USER: ubuntu
  DEPLOY_DIRECTORY: /opt/max-live/dev/max-live-deployment
  # Ensure SSH_PRIVATE_KEY is set in your GitLab CI/CD variables

# before_script:
#   - 'which ssh-agent || ( apk update -y && apk add openssh-client -y )'
#   - eval $(ssh-agent -s)
#   - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
#   - mkdir -p ~/.ssh
#   - chmod 700 ~/.ssh
#   - ssh-keyscan $REMOTE_HOST >> ~/.ssh/known_hosts
#   - chmod 644 ~/.ssh/known_hosts

build:
  stage: build
  tags:
    - max-live
  # image: docker:latest
  # services:
  #   - docker:dind
  script:
    - git config --global --add safe.directory $DEPLOY_DIRECTORY
    - pushd $DEPLOY_DIRECTORY
    - git checkout dev
    - git pull
    - VERSION=$(grep MAX_LIVE_SPRING_GATEWAY_VERSION .env | cut -d '=' -f2)
    - echo "VERSION=$VERSION"
    - NEW_VERSION=$(($VERSION + 1))
    - echo "NEW_VERSION=$NEW_VERSION"
    - IMAGE_NAME="$DOCKER_IMAGE_NAME:$NEW_VERSION"
    - echo "IMAGE_NAME=$IMAGE_NAME"
    - popd
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
    - docker build -t $DOCKER_IMAGE_NAME .
    - docker push $DOCKER_IMAGE_NAME

deploy:
  stage: deploy
  # image: alpine:latest
  tags:
    - max-live
  # before_script:
  #   - apk --no-cache add openssh-client
  #   - eval $(ssh-agent -s)
  #   - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  #   - mkdir -p ~/.ssh
  #   - chmod 700 ~/.ssh
  #   - ssh-keyscan $REMOTE_HOST >> ~/.ssh/known_hosts
  #   - chmod 644 ~/.ssh/known_hosts
  script:
  #  - ssh $REMOTE_USER@$REMOTE_HOST "docker pull $DOCKER_IMAGE_NAME && docker stop max_live_spring_gateway || true && docker rm max_live_spring_gateway || true && docker run -d --name max_live_spring_gateway -p 8080:8080 $DOCKER_IMAGE_NAME"
    - git config --global --add safe.directory $DEPLOY_DIRECTORY
    - cd $DEPLOY_DIRECTORY 
    - git checkout dev
    - git pull
    - VERSION=$(grep MAX_LIVE_SPRING_GATEWAY_VERSION .env | cut -d '=' -f2)
    - NEW_VERSION=$(($VERSION + 1))
    - echo "MAX_LIVE_SPRING_GATEWAY_VERSION=$NEW_VERSION" > .env
    - cat .env
    - git add .env 
    - git commit -m "max-live-spring-business branch=dev $(date +\"%Y-%m-%d %H:%M:%S\")" 
    - git push



